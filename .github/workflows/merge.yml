name: Merge Dev to Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:   # keep manual trigger too, for re-runs

permissions:
  contents: write

concurrency:
  group: merge-dev-to-staging
  cancel-in-progress: false   # never cancel a merge mid-flight

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "aktiv-jay-butani"
          git config user.email "jay.butani@aktivsoftware.com"

      - name: Fetch branches
        run: git remote update

      - name: Checkout staging
        run: |
          git checkout -B staging origin/staging
          git pull origin staging

      - name: Merge dev
        run: git merge origin/dev --no-edit

      - name: Push staging
        run: git push origin staging
        # This push is what triggers staging-build-test-deploy.yml below.
